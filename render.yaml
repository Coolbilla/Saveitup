services:
  - type: web
    name: saveitup-server
    runtime: node
    plan: free
    buildCommand: npm install && npm run build --workspace=server
    startCommand: node server/dist/index.js
    envVars:
      - key: PORT
        value: 3001
      - key: SAVEITUP_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # AI used by the save pipeline (cleanup / categorize / embeddings) and /url-to-markdown
      - key: OPENROUTER_API_KEY
        sync: false
      - key: SUMMARY_PROVIDER
        value: openrouter
      - key: CATEGORIZE_PROVIDER
        value: openrouter
      - key: CLEANUP_PROVIDER
        value: openrouter
      - key: EMBEDDING_PROVIDER
        value: openrouter
      # Comma-separated web origins allowed to call the API (e.g. the mobile web app). Empty = allow all.
      - key: ALLOWED_ORIGINS
        sync: false
